<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Play | Beerio Kart</title>

    <link rel="stylesheet" href="../css/play.css">
</head>

<body>

    <header class="page-header">

        <a href="index.html" class="home-link">
            ← Home
        </a>

        <h1>
            🏎️ Grand Prix 🏎️
        </h1>

    </header>


    <main class="play-container">


        <!-- =========================================
             SELECT PLAYERS
        ========================================== -->

        <section class="card">

            <h2>
                Select Players
            </h2>

            <div
                id="player-list"
                class="player-grid"
            ></div>

            <button id="start-grand-prix-btn">
                Start Grand Prix
            </button>

        </section>


        <!-- =========================================
             GRAND PRIX
        ========================================== -->

        <section
            id="grand-prix-section"
            class="card hidden"
        >

            <h2>
                Enter Race Results
            </h2>


            <form id="grand-prix-form">


                <!-- GRAND PRIX NAME -->

                <label for="grand-prix-name">
                    Grand Prix Name
                </label>

                <input
                    type="text"
                    id="grand-prix-name"
                    placeholder="Ex: Tavern Pregame"
                >


                <!-- =========================================
                     GRAND PRIX ODDS
                ========================================== -->

                <section
                    id="grand-prix-odds"
                    class="grand-prix-odds"
                >

                    <div class="odds-header">

                        <h2>
                            🎰 Grand Prix Odds
                        </h2>

                        <p>
                            Estimated chance to win based on previous performance
                        </p>

                    </div>


                    <div
                        id="odds-list"
                        class="odds-list"
                    ></div>

                </section>


                <!-- =========================================
                     RACES
                ========================================== -->

                <div id="races-container"></div>


                <!-- =========================================
                     CURRENT STANDINGS
                ========================================== -->

                <section class="scoreboard">

                    <h2>
                        Current Standings
                    </h2>

                    <div id="scoreboard-list"></div>

                </section>


                <!-- SAVE -->

                <button type="submit">
                    Save Grand Prix
                </button>


            </form>

        </section>


        <!-- =========================================
             FINAL RESULTS
        ========================================== -->

        <section
            id="final-results-section"
            class="card hidden"
        >

            <h2>
                🏆 Grand Prix Complete
            </h2>

            <div id="podium-list"></div>

            <button id="new-grand-prix-btn">
                Start New Grand Prix
            </button>

        </section>


    </main>


    <script src="../js/play.js"></script>

</body>

</html>
